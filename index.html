<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="百名店地圖">
<meta name="theme-color" content="#f7f5f2">
<title>日本百名店地圖</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f7f5f2;
  --surface:   #ffffff;
  --panel:     #f2f0ed;
  --accent:    #2a7c6f;
  --accent-lt: #e8f4f2;
  --accent2:   #d4763b;
  --text:      #1c1c1c;
  --text-sub:  #555550;
  --muted:     #999990;
  --border:    #e2dfd9;
  --border-md: #ccc9c3;
  --card-bg:   #ffffff;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius:    10px;
  --font:      'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  --safe-top:  env(safe-area-inset-top, 0px);
  --safe-bot:  env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bot);
}

/* Header */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
}

#header-left {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex-shrink: 0;
}
#header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  letter-spacing: -0.01em;
}
#header-updated {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.brand-dot { color: var(--accent); }

/* Category Dropdown */
#cat-dropdown-wrap { position: relative; flex-shrink: 0; }

#cat-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--panel);
  border: 1px solid var(--border-md);
  border-radius: 7px;
  padding: 6px 9px 6px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font);
  transition: border-color 0.15s, background 0.15s;
  max-width: 130px;
}
#cat-btn:focus { outline: none; }
#cat-btn.open { border-color: var(--accent); background: var(--accent-lt); }
#cat-btn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#cat-btn-arrow { font-size: 9px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
#cat-btn.open #cat-btn-arrow { transform: rotate(180deg); }

#cat-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  width: 220px;
  background: var(--surface);
  border: 1px solid var(--border-md);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  overflow: hidden;
}
#cat-dropdown.open { display: block; }

#cat-search-wrap { padding: 8px 10px 6px; border-bottom: 1px solid var(--border); }
#cat-search {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--text);
  font-family: var(--font);
  outline: none;
}
#cat-search:focus { border-color: var(--accent); }
#cat-search::placeholder { color: var(--muted); }

#cat-list { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; }

.cat-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  font-size: 13px;
  color: var(--text-sub);
  cursor: pointer;
  transition: background 0.1s;
  border-bottom: 1px solid var(--border);
}
.cat-option:last-child { border-bottom: none; }
.cat-option:active, .cat-option:hover { background: var(--panel); }
.cat-option.selected { color: var(--accent); font-weight: 600; background: var(--accent-lt); }
.cat-option-emoji { font-size: 15px; flex-shrink: 0; }
.cat-option-name { flex: 1; }
.cat-option-count { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: auto; }

/* Search */
#search-wrap { flex: 1; position: relative; min-width: 0; }
#search {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border-md);
  border-radius: 7px;
  padding: 6px 28px 6px 12px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
  font-family: var(--font);
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }
#search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; display: none; line-height: 1; padding: 2px;
}

/* Map */
#map { flex: 1; min-height: 0; z-index: 1; }

/* Popup */
.leaflet-popup-content-wrapper {
  background: var(--card-bg) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-lg) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; width: 240px !important; }
.leaflet-popup-tip { background: var(--card-bg) !important; }
.leaflet-popup-close-button { color: var(--muted) !important; font-size: 18px !important; padding: 6px 8px !important; }

.popup-card { padding: 13px 13px 11px; font-family: var(--font); }
.popup-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 5px; }
.popup-cat {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--accent-lt); color: var(--accent);
  font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; font-weight: 600;
}
.popup-addr { font-size: 11px; color: var(--text-sub); line-height: 1.45; margin-bottom: 9px; }
.popup-comment {
  font-size: 11px; color: var(--accent2); line-height: 1.4;
  margin-bottom: 9px; padding: 5px 8px;
  background: #fff8f3; border-left: 3px solid var(--accent2);
  border-radius: 0 6px 6px 0;
}
.popup-scores { display: flex; gap: 8px; margin-bottom: 10px; }
.popup-score-item { flex: 1; background: var(--panel); border-radius: 7px; padding: 6px 8px; text-align: center; }
.popup-score-label { font-size: 9px; color: var(--muted); margin-bottom: 2px; font-weight: 500; letter-spacing: 0.03em; }
.popup-score-val { font-size: 15px; font-weight: 700; color: var(--accent2); }
.popup-score-val small { font-size: 10px; color: var(--muted); font-weight: 400; }
.popup-actions { display: flex; gap: 6px; }
.popup-btn {
  flex: 1; padding: 7px 0; border-radius: 7px; font-size: 11px; font-weight: 600;
  text-align: center; text-decoration: none; cursor: pointer; border: none;
  font-family: var(--font); transition: opacity 0.15s;
}
.popup-btn:active { opacity: 0.7; }
.popup-btn-nav { background: var(--accent); color: #fff; }
.popup-btn-tab { background: var(--panel); border: 1px solid var(--border-md); color: var(--text-sub); }

/* Bottom Sheet */
#bottom-sheet {
  position: fixed; bottom: var(--safe-bot); left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 14px 14px 0 0; z-index: 500;
  transition: transform 0.33s cubic-bezier(.22,.68,0,1.18);
  transform: translateY(calc(100% - 50px));
  max-height: 74vh; display: flex; flex-direction: column;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.07);
}
#bottom-sheet.open { transform: translateY(0); }

#sheet-handle-area {
  padding: 10px 14px 9px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; flex-shrink: 0; border-bottom: 1px solid var(--border);
}
#sheet-handle { width: 32px; height: 4px; background: var(--border-md); border-radius: 2px; flex-shrink: 0; }
#sheet-title { font-size: 12px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.06em; }
#sheet-count { font-size: 12px; color: var(--accent); font-weight: 700; margin-left: auto; }

#sheet-list { overflow-y: auto; flex: 1; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

.list-item {
  display: flex; align-items: center; padding: 10px 14px; gap: 11px;
  cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.list-item:active, .list-item:hover { background: var(--panel); }
.list-item:last-child { border-bottom: none; }
.list-icon {
  width: 36px; height: 36px; background: var(--accent-lt); border-radius: 9px;
  display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
}
.list-info { flex: 1; min-width: 0; }
.list-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.list-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-comment { font-size: 10px; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.list-score { font-size: 13px; font-weight: 700; color: var(--accent2); flex-shrink: 0; }

/* GPS FAB */
#gps-btn {
  position: fixed; right: 14px; bottom: calc(62px + var(--safe-bot));
  width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--border-md);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--shadow-md); z-index: 600; font-size: 19px; transition: all 0.2s;
}
#gps-btn:active { transform: scale(0.92); }
#gps-btn.locating { animation: pulse 1s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(42,124,111,0.35); }
  50%       { box-shadow: 0 0 0 8px rgba(42,124,111,0); }
}

/* Toast */
#toast {
  position: fixed; top: calc(56px + var(--safe-top)); left: 50%;
  transform: translateX(-50%) translateY(-14px);
  background: var(--text); color: var(--bg);
  padding: 7px 16px; border-radius: 20px; font-size: 12px; font-weight: 500;
  z-index: 9999; opacity: 0; transition: all 0.25s; white-space: nowrap; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Loading */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; gap: 14px; transition: opacity 0.4s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loader-emoji { font-size: 44px; animation: bounce 0.75s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
.loader-text { font-size: 13px; color: var(--muted); }

/* Clusters */
.marker-cluster-small  { background-color: rgba(42,124,111,0.12) !important; }
.marker-cluster-medium { background-color: rgba(42,124,111,0.16) !important; }
.marker-cluster-large  { background-color: rgba(42,124,111,0.20) !important; }
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background-color: rgba(42,124,111,0.82) !important; color: #fff !important; font-weight: 700 !important;
}

/* Markers */
.custom-marker {
  background: var(--accent); border: 2.5px solid #fff;
  border-radius: 50% 50% 50% 0; width: 28px; height: 28px;
  transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}
.custom-marker span { transform: rotate(45deg); font-size: 13px; line-height: 1; }
.my-location-marker {
  background: #4285F4; border: 3px solid #fff; border-radius: 50%;
  width: 16px; height: 16px; box-shadow: 0 0 0 4px rgba(66,133,244,0.22);
}

#no-results { display: none; text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
#cat-backdrop { display: none; position: fixed; inset: 0; z-index: 1999; }
#cat-backdrop.open { display: block; }
</style>
</head>
<body>

<div id="loading">
  <div class="loader-emoji">🍜</div>
  <div class="loader-text">載入百名店資料中…</div>
</div>

<div id="toast"></div>
<div id="cat-backdrop"></div>

<div id="app">
  <div id="header">
    <div id="header-left">
    <div id="header-title">🍴 百名店<span class="brand-dot">•</span>地圖</div>
    <div id="header-updated">–</div>
  </div>

    <div id="cat-dropdown-wrap">
      <button id="cat-btn">
        <span id="cat-btn-label">全部分類</span>
        <span id="cat-btn-arrow">▼</span>
      </button>
      <div id="cat-dropdown">
        <div id="cat-search-wrap">
          <input type="search" id="cat-search" placeholder="搜尋分類…" autocomplete="off">
        </div>
        <div id="cat-list"></div>
      </div>
    </div>

    <div id="search-wrap">
      <input type="search" id="search" placeholder="搜尋店名…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="search-clear">✕</button>
    </div>
  </div>

  <div id="map"></div>
</div>

<button id="gps-btn" title="我的位置">📍</button>

<div id="bottom-sheet">
  <div id="sheet-handle-area">
    <div id="sheet-handle"></div>
    <div id="sheet-title">店家列表</div>
    <div id="sheet-count">–</div>
  </div>
  <div id="sheet-list">
    <div id="no-results">🔍 找不到符合的店家</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script>
const CAT_EMOJI = {
  'すし':'🍣','ラーメン':'🍜','焼き鳥':'🍗','焼肉':'🥩',
  '天ぷら':'🍤','日本料理':'🏯','懐石・会席料理':'🎎',
  'フレンチ':'🥐','イタリアン':'🍝','中華料理':'🥢',
  'ステーキ':'🥩','蕎麦':'🍜','うどん':'🍜','カレー':'🍛',
  'スペイン料理':'🥘','バー・お酒':'🍶','パン':'🥐','スイーツ':'🍰',
  '居酒屋':'🏮','鍋':'🫕'
};
function catEmoji(cat) { return CAT_EMOJI[cat] || '🍴'; }

// CartoDB Positron
const map = L.map('map', { zoomControl: false, attributionControl: false, tap: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.attribution({ prefix: false, position: 'bottomleft' }).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50, spiderfyOnMaxZoom: true, showCoverageOnHover: false, zoomToBoundsOnClick: true,
});
map.addLayer(clusterGroup);

function makeIcon(cat) {
  return L.divIcon({
    className: '',
    html: '<div class="custom-marker"><span>' + catEmoji(cat) + '</span></div>',
    iconSize: [28,28], iconAnchor: [14,28], popupAnchor: [0,-30],
  });
}
const myLocationIcon = L.divIcon({
  className: '', html: '<div class="my-location-marker"></div>',
  iconSize: [16,16], iconAnchor: [8,8],
});

let allData=[], filteredData=[], markers=[];
let activeCategory='all', searchQuery='', myLocMarker=null, sheetOpen=false;
let myLat=null, myLng=null;

function popupHTML(d) {
  const navUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + d.lat + ',' + d.lng;
  const tabUrl = d.tabelog_url || 'https://tabelog.com/';
  const tScore = d.tabelog_score && d.tabelog_score !== '無' ? d.tabelog_score : '—';
  const gScore = d.google_rating && d.google_rating !== '無' ? d.google_rating : '—';
  return '<div class="popup-card">' +
    '<div class="popup-name">' + d.name + '</div>' +
    '<div class="popup-cat">' + catEmoji(d.category) + ' ' + d.category + '</div>' +
    '<div class="popup-addr">📍 ' + (d.address || '地址未知') + '</div>' +
    '<div class="popup-scores">' +
      '<div class="popup-score-item"><div class="popup-score-label">TABELOG</div><div class="popup-score-val">' + tScore + '</div></div>' +
      '<div class="popup-score-item"><div class="popup-score-label">GOOGLE</div><div class="popup-score-val">' + gScore + ' <small>(' + (d.reviews||0) + ')</small></div></div>' +
    '</div>' +
    (d.comment ? '<div class="popup-comment">💬 ' + d.comment + '</div>' : '') +
    '<div class="popup-actions">' +
      '<a class="popup-btn popup-btn-nav" href="' + navUrl + '" target="_blank">🧭 導航</a>' +
      '<a class="popup-btn popup-btn-tab" href="' + tabUrl + '" target="_blank">📖 Tabelog</a>' +
    '</div></div>';
}

function renderMarkers(data) {
  clusterGroup.clearLayers(); markers = [];
  data.forEach(function(d) {
    var m = L.marker([d.lat, d.lng], { icon: makeIcon(d.category) });
    m.bindPopup(popupHTML(d), { maxWidth: 260, minWidth: 240 });
    m.on('click', function() { map.setView([d.lat, d.lng], Math.max(map.getZoom(), 14)); openSheet(false); });
    clusterGroup.addLayer(m);
    markers.push({ marker: m, data: d });
  });
}

function renderList(data) {
  var list = document.getElementById('sheet-list');
  var noR  = document.getElementById('no-results');
  document.getElementById('sheet-count').textContent = data.length + ' 間';
  Array.from(list.querySelectorAll('.list-item')).forEach(function(el) { el.remove(); });
  if (data.length === 0) { noR.style.display = 'block'; return; }
  noR.style.display = 'none';
  data.forEach(function(d) {
    var tScore = d.tabelog_score && d.tabelog_score !== '無' ? d.tabelog_score : '—';
    var addr = d.address || '地址未知';
    var el = document.createElement('div');
    el.className = 'list-item';
    el.innerHTML =
      '<div class="list-icon">' + catEmoji(d.category) + '</div>' +
      '<div class="list-info">' +
        '<div class="list-name">' + d.name + '</div>' +
        '<div class="list-meta">' + d.category + ' · ' + addr.substring(0,28) + (addr.length>28?'…':'') + '</div>' +
        (d.comment ? '<div class="list-comment">💬 ' + d.comment + '</div>' : '') +
      '</div>' +
      '<div class="list-score">' + tScore + '</div>';
    el.addEventListener('click', function() {
      map.setView([d.lat, d.lng], 16);
      var found = markers.find(function(m) { return m.data.name === d.name; });
      if (found) clusterGroup.zoomToShowLayer(found.marker, function() { found.marker.openPopup(); });
      openSheet(false);
    });
    list.appendChild(el);
  });
}

function applyFilter() {
  var q = searchQuery.toLowerCase();
  filteredData = allData.filter(function(d) {
    var catOK  = activeCategory === 'all' || d.category === activeCategory;
    var nameOK = !q || d.name.toLowerCase().includes(q) || (d.address||''). toLowerCase().includes(q);
    return catOK && nameOK;
  });
  renderMarkers(filteredData);
  if (myLat !== null) {
    var sorted = filteredData.slice().sort(function(a,b) {
      return haversine(myLat,myLng,a.lat,a.lng) - haversine(myLat,myLng,b.lat,b.lng);
    });
    renderList(sorted);
  } else {
    renderList(filteredData);
  }
}

function buildCategoryDropdown(data) {
  var catCount = {};
  data.forEach(function(d) { catCount[d.category] = (catCount[d.category]||0) + 1; });
  var cats = Object.keys(catCount).sort();
  var catList   = document.getElementById('cat-list');
  var catSearch = document.getElementById('cat-search');
  var catBtn    = document.getElementById('cat-btn');
  var catLabel  = document.getElementById('cat-btn-label');
  var dropdown  = document.getElementById('cat-dropdown');
  var backdrop  = document.getElementById('cat-backdrop');

  function buildOptions(filterText) {
    catList.innerHTML = '';
    if (!filterText || '全部'.includes(filterText)) {
      var all = document.createElement('div');
      all.className = 'cat-option' + (activeCategory==='all'?' selected':'');
      all.innerHTML = '<span class="cat-option-emoji">🍴</span><span class="cat-option-name">全部分類</span><span class="cat-option-count">' + data.length + '</span>';
      all.addEventListener('click', function() { selectCat('all', '全部分類'); });
      catList.appendChild(all);
    }
    cats.forEach(function(cat) {
      if (filterText && !cat.includes(filterText)) return;
      var opt = document.createElement('div');
      opt.className = 'cat-option' + (activeCategory===cat?' selected':'');
      opt.innerHTML = '<span class="cat-option-emoji">' + catEmoji(cat) + '</span><span class="cat-option-name">' + cat + '</span><span class="cat-option-count">' + catCount[cat] + '</span>';
      opt.addEventListener('click', (function(c) { return function() { selectCat(c, catEmoji(c)+' '+c); }; })(cat));
      catList.appendChild(opt);
    });
  }

  function selectCat(cat, label) {
    activeCategory = cat;
    catLabel.textContent = label;
    closeDrop();
    applyFilter();
    if (filteredData.length > 0) fitToData(filteredData);
  }
  function openDrop() {
    dropdown.classList.add('open'); catBtn.classList.add('open'); backdrop.classList.add('open');
    catSearch.value = ''; buildOptions('');
    setTimeout(function() { catSearch.focus(); }, 50);
  }
  function closeDrop() {
    dropdown.classList.remove('open'); catBtn.classList.remove('open'); backdrop.classList.remove('open');
  }
  catBtn.addEventListener('click', function() { dropdown.classList.contains('open') ? closeDrop() : openDrop(); });
  backdrop.addEventListener('click', closeDrop);
  catSearch.addEventListener('input', function() { buildOptions(catSearch.value.trim()); });
  buildOptions('');
}

function fitToData(data) {
  if (!data.length) return;
  map.fitBounds(L.latLngBounds(data.map(function(d) { return [d.lat,d.lng]; })), { padding:[40,40] });
}

function openSheet(state) {
  sheetOpen = state;
  document.getElementById('bottom-sheet').classList.toggle('open', state);
}
document.getElementById('sheet-handle-area').addEventListener('click', function() { openSheet(!sheetOpen); });

var searchEl = document.getElementById('search');
var clearBtn = document.getElementById('search-clear');
searchEl.addEventListener('input', function() {
  searchQuery = searchEl.value;
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  applyFilter();
  if (filteredData.length > 0) fitToData(filteredData);
  openSheet(true);
});
clearBtn.addEventListener('click', function() {
  searchEl.value = ''; searchQuery = '';
  clearBtn.style.display = 'none';
  applyFilter(); fitToData(allData); openSheet(false);
});

var gpsBtn = document.getElementById('gps-btn');
gpsBtn.addEventListener('click', function() {
  gpsBtn.classList.add('locating');
  showToast('取得位置中…');
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      myLat = pos.coords.latitude; myLng = pos.coords.longitude;
      if (myLocMarker) map.removeLayer(myLocMarker);
      myLocMarker = L.marker([myLat,myLng], { icon: myLocationIcon })
        .bindPopup('<div style="font-size:12px;padding:4px 6px;">📍 你在這裡</div>')
        .addTo(map);
      map.setView([myLat,myLng], 14);
      gpsBtn.classList.remove('locating'); gpsBtn.textContent = '🔵';
      showToast('已定位！');
      applyFilter(); openSheet(true);
    },
    function(err) { gpsBtn.classList.remove('locating'); showToast('無法取得位置'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

function haversine(lat1,lng1,lat2,lng2) {
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

async function init() {
  var data = null;
  try {
    var resp = await fetch('./restaurants_data.json');
    if (resp.ok) {
      var json = await resp.json();
      // 支援兩種格式：純陣列 或 { updated, records } wrapper
      if (Array.isArray(json)) {
        data = json;
      } else {
        data = json.records || [];
        if (json.updated) {
          document.getElementById('header-updated').textContent = '更新於 ' + json.updated;
        }
      }
    }
  } catch(e) {}
  if (!data || data.length === 0) {
    showToast('請加入 restaurants_data.json');
    data = [];
  } else {
    showToast('載入 ' + data.length + ' 間店家');
  }
  // 需求1：過濾停業店家
  data = data.filter(function(d) { return d.comment !== '停業'; });

  // 需求2：顯示更新時間
  if (data._updated || (Array.isArray(data) === false && data.updated)) {
    // 包在 wrapper 物件裡的格式
  }
  allData = data; filteredData = data;
  buildCategoryDropdown(data);
  renderMarkers(data); renderList(data);
  if (data.length > 0) fitToData(data);
  var loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(function() { loader.remove(); }, 500);
}

init();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
